# Every push and pull request: run the tests, lint and build, and build both Docker images.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Tests never call real AI providers or Supabase (see tests/conftest.py)
      - run: pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t rhombus-backend ./backend
      - run: docker build -t rhombus-frontend ./frontend
      - name: Backend container starts and answers
        run: |
          docker run -d --name api -e PORT=8000 -p 8000:8000 rhombus-backend
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && exit 0; sleep 2; done
          docker logs api; exit 1

  audit:
    name: Dependency audit (known vulnerabilities)
    runs-on: ubuntu-latest
    # Report, don't block: a new advisory shouldn't stop unrelated work, but it shows up here
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cd frontend && npm audit --omit=dev --audit-level=high
