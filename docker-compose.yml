# Run the whole app in containers, as it runs when deployed:  docker compose up --build
# Then open http://localhost:3000
#
# Settings come from backend/.env (AI keys, Supabase); the lines below override the ones that
# must be different on a shared server. Frontend build settings come from your shell or a root .env.

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000
      # Code cells run in the hardened sandbox (another user, limits, no network, no programs),
      # and only for notebooks in a signed-in account
      - ALLOW_CUSTOM_CODE=true
      - CODE_SANDBOX=hardened
      - CODE_FOR=accounts
      - RATE_LIMITS=true
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data   # only used when no Supabase database/storage is configured
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
