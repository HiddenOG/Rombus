# AutoML Platform — Docker Compose

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SESSION_TTL_HOURS=24
      # User-written code runs with full access to the server: never allow it on a shared deployment
      - ALLOW_CUSTOM_CODE=false
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
